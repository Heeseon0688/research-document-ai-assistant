services:
  backend:
    build: {context: ./backend, dockerfile: Dockerfile}
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./.cache:/root/.cache"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app", "/app/node_modules"]
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    depends_on: [backend]
